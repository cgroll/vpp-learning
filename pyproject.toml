[project]
name = "vpp-learning"
version = "0.1.0"
description = "Learning project for Virtual Power Plant operations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # pipeline infrastructure
    "dvc>=3.67.1",
    "ipykernel>=6.29.0",
    "jupytext>=1.19.0",
    "mystmd>=1.10.1",
    "nbformat>=5.10.0",
    # data
    "pandas>=2.2.0",
    "pyarrow>=19.0.0",
    "numpy>=2.0.0",
    # visualization
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    # machine learning
    "scikit-learn>=1.5.0",
    "lightgbm>=4.5.0",
    # solar physics / weather
    "pvlib>=0.11.0",
    # optimization
    "cvxpy>=1.5.0",
    # statistics
    "statsmodels>=0.14.0",
    # utilities
    "tqdm>=4.66.0",
    "requests>=2.32.0",
    "pydantic>=2.0.0",
    "pulp>=3.3.2",
    "nbconvert>=7.17.1",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vpp"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
