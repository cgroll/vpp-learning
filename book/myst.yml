version: 1
project:
  title: VPP Learning
  authors:
    - name: Christian Groll
  copyright: '2026'
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
  github: cgroll/vpp-learning
  toc:
    - file: markdown/index.md
    - title: Stage 1 — Battery Dispatch
      children:
        - file: notebooks/02_battery_dispatch_ideal.ipynb
          title: 1a — Ideal LP (perfect foresight)
        - file: notebooks/03_battery_dispatch_realistic.ipynb
          title: 1b — Efficiency + degradation cost
        - file: notebooks/04_simultaneous_dispatch.ipynb
          title: 1b addendum — Simultaneous C/D analysis
    - title: Stage 2 — Forecasting & Realistic Dispatch
      children:
        - file: notebooks/05_price_forecast_baseline.ipynb
          title: 2a — Baseline price forecast
        - file: notebooks/06_forecast_dispatch.ipynb
          title: 2b — Forecast-driven dispatch
    - title: Stage 3 — Value Stacking
      children:
        - file: notebooks/12_fcr_comparison.ipynb
          title: 3a — FCR vs DA arbitrage
    - title: Cross-Scenario Analysis
      children:
        - file: notebooks/09_dispatch_overview.ipynb
          title: All-scenarios overview
        - file: notebooks/10_constraint_comparison.ipynb
          title: Daily reset vs free horizon
        - file: notebooks/11_simultaneous_cd.ipynb
          title: LP vs MILP vs LP+price floor
site:
  options:
    folders: true
  template: book-theme
