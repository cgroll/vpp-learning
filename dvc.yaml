      - data/processed/dispatch_schedules.parquet
    outs:
      - book/notebooks/09_dispatch_overview.ipynb:
          cache: false
      - output/images/09_dispatch_overview.png:
          cache: false
      - output/images/09_scenario_table.png:
          cache: false

  constraint_comparison:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/10_constraint_comparison.ipynb pipeline/10_constraint_comparison.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/10_constraint_comparison.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/10_constraint_comparison.ipynb')"
    deps:
