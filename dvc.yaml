      - output/images/11_simultaneous_cd.png:
          cache: false

  compute_forecasts:
    cmd: uv run python pipeline/07_compute_forecasts.py
    deps:
      - pipeline/07_compute_forecasts.py
      - data/downloads/smard/prices_de_lu.parquet
    outs:
      - data/processed/forecasts.parquet

  compute_dispatch:
    cmd: uv run python pipeline/08_compute_dispatch.py
    deps:
      - pipeline/08_compute_dispatch.py
      - vpp/battery.py
      - vpp/dispatch.py
      - vpp/scenarios.py
      - data/downloads/smard/prices_de_lu.parquet
      - data/processed/forecasts.parquet
    outs:
      - data/processed/dispatch_schedules.parquet

