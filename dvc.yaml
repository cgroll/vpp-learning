      - data/processed/dispatch_schedules.parquet
    outs:
      - book/notebooks/06_forecast_dispatch.ipynb:
          cache: false
      - output/images/06_annual_revenue_comparison.png:
          cache: false
      - output/images/06_forecast_dispatch_detail.png:
          cache: false

  simultaneous_dispatch:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/04_simultaneous_dispatch.ipynb pipeline/04_simultaneous_dispatch.py
