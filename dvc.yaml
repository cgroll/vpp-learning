          cache: false
      - output/images/04_simultaneous_cd_analysis.png:
          cache: false

  dispatch_overview:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/09_dispatch_overview.ipynb pipeline/09_dispatch_overview.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/09_dispatch_overview.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/09_dispatch_overview.ipynb')"
    deps:
      - pipeline/09_dispatch_overview.py
