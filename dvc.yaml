    outs:
      - book/notebooks/10_constraint_comparison.ipynb:
          cache: false
      - output/images/10_constraint_comparison.png:
          cache: false
      - output/images/10_cycling_comparison.png:
          cache: false

  simultaneous_cd:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/11_simultaneous_cd.ipynb pipeline/11_simultaneous_cd.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/11_simultaneous_cd.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/11_simultaneous_cd.ipynb')"
    deps:
