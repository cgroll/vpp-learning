stages:
  download_regelleistung:
    cmd: PYTHONUNBUFFERED=1 uv run python pipeline/01_download_regelleistung.py
    outs:
      - data/downloads/regelleistung/fcr_prices.parquet
      - data/downloads/regelleistung/afrr_capacity_prices.parquet

  download_smard_prices:
    cmd: uv run python pipeline/01_download_smard_prices.py
    outs:
      - data/downloads/smard/prices_de_lu.parquet

  battery_dispatch_ideal:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/02_battery_dispatch_ideal.ipynb pipeline/02_battery_dispatch_ideal.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/02_battery_dispatch_ideal.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/02_battery_dispatch_ideal.ipynb')"
    deps:
      - pipeline/02_battery_dispatch_ideal.py
      - data/downloads/smard/prices_de_lu.parquet
      - data/processed/dispatch_schedules.parquet
    outs:
      - book/notebooks/02_battery_dispatch_ideal.ipynb:
          cache: false
      - output/images/02_diurnal_dispatch_profile.png:
          cache: false
      - output/images/02_daily_revenue_heatmap.png:
          cache: false
      - output/images/02_annual_revenue_comparison.png:
          cache: false
      - output/images/02_soc_trajectory.png:
          cache: false
      - output/images/02_negative_price_breakdown.png:
          cache: false
      - output/images/02_annual_revenue_table.png:
          cache: false
      - output/images/02_irr_analysis.png:
          cache: false

  battery_dispatch_realistic:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/03_battery_dispatch_realistic.ipynb pipeline/03_battery_dispatch_realistic.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/03_battery_dispatch_realistic.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/03_battery_dispatch_realistic.ipynb')"
    deps:
      - pipeline/03_battery_dispatch_realistic.py
      - data/downloads/smard/prices_de_lu.parquet
      - data/processed/dispatch_schedules.parquet
    outs:
      - book/notebooks/03_battery_dispatch_realistic.ipynb:
          cache: false
      - output/images/03_scenario_comparison.png:
          cache: false
      - output/images/03_diurnal_comparison.png:
          cache: false
      - output/images/03_degradation_sensitivity.png:
          cache: false
      - output/images/03_free_horizon_comparison.png:
          cache: false

  forecast_baseline:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/05_price_forecast_baseline.ipynb pipeline/05_price_forecast_baseline.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/05_price_forecast_baseline.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/05_price_forecast_baseline.ipynb')"
    deps:
      - pipeline/05_price_forecast_baseline.py
      - data/downloads/smard/prices_de_lu.parquet
    outs:
      - book/notebooks/05_price_forecast_baseline.ipynb:
          cache: false
      - output/images/05_per_hour_mae.png:
          cache: false
      - output/images/05_forecast_sample.png:
          cache: false

  forecast_dispatch:
    cmd: |
      set -e
      MPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel python3 --output book/notebooks/06_forecast_dispatch.ipynb pipeline/06_forecast_dispatch.py
      uv run python -c "import nbformat; nb = nbformat.read('book/notebooks/06_forecast_dispatch.ipynb', as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw' and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/06_forecast_dispatch.ipynb')"
    deps:
      - pipeline/06_forecast_dispatch.py
