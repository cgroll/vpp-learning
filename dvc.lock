      hash: md5
      md5: f1886a2b97cd6a365960541adb2098fa
      size: 828689
  battery_dispatch_ideal:
    cmd: "set -e\nMPLBACKEND=Agg uv run jupytext --to notebook --execute --set-kernel
      python3 --output book/notebooks/02_battery_dispatch_ideal.ipynb pipeline/02_battery_dispatch_ideal.py\n\
      uv run python -c \"import nbformat; nb = nbformat.read('book/notebooks/02_battery_dispatch_ideal.ipynb',
      as_version=4); nb.cells = [c for c in nb.cells if not (c.cell_type == 'raw'
      and 'jupytext' in c.source)]; nbformat.write(nb, 'book/notebooks/02_battery_dispatch_ideal.ipynb')\"\
      \n"
